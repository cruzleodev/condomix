# Infraestrutura local de desenvolvimento.
# O Spring Boot sobe estes serviços sozinho ao rodar a aplicação (spring-boot-docker-compose).
# Também dá para subir manualmente: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: condomix-postgres
    environment:
      POSTGRES_DB: condomix
      POSTGRES_USER: condomix
      POSTGRES_PASSWORD: condomix
      TZ: America/Belem
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condomix -d condomix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
