# Mensagens de erro da API em português (formato RFC 9457, campo "detail").
# O Spring usa estes códigos no lugar do texto padrão em inglês. Sem nomes internos de campos: o usuário vê o texto.
# {1} é o valor recebido. Aspas simples precisam ser dobradas (MessageFormat).
problemDetail.org.springframework.beans.TypeMismatchException=O valor "{1}" não é válido. Confira o que foi preenchido e tente de novo.
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Falta preencher uma informação obrigatória.
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=Os dados enviados não estão no formato esperado. Confira os campos e tente de novo.
