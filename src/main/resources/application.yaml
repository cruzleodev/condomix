spring:
  application:
    name: condomix

  profiles:
    default: dev   # sem perfil definido, roda como desenvolvimento. Em produção: SPRING_PROFILES_ACTIVE=prod

  mvc:
    problemdetails:
      enabled: true   # erros da API no formato padrão RFC 9457 (application/problem+json)

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/condomix}
    username: ${DB_USER:condomix}
    password: ${DB_PASSWORD:condomix}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é criado só pelo Flyway, nunca pelo Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  docker:
    compose:
      lifecycle-management: start-only   # sobe o Postgres e deixa rodando ao parar a app

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

condomix:
  seguranca:
    jwt:
      segredo: ${JWT_SEGREDO:}   # obrigatório, mínimo 32 bytes. Em desenvolvimento vem do application-dev.yaml
      validade: 12h
      emissor: condomix
