spring:
  application:
    name: condomix

  profiles:
    default: dev   # sem perfil definido, roda como desenvolvimento. Em produção: SPRING_PROFILES_ACTIVE=prod

  mvc:
    problemdetails:
      enabled: true   # erros da API no formato padrão RFC 9457 (application/problem+json)

  servlet:
    multipart:
      max-file-size: 20MB      # tamanho máximo de um arquivo enviado
      max-request-size: 21MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/condomix}
    username: ${DB_USER:condomix}
    password: ${DB_PASSWORD:condomix}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é criado só pelo Flyway, nunca pelo Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  docker:
    compose:
      lifecycle-management: start-only   # sobe o Postgres e deixa rodando ao parar a app

  modulith:
    events:
      # Os eventos entre módulos ficam guardados no Postgres (tabela event_publication) até serem tratados.
      completion-mode: delete                       # tratado, sai da tabela
      republish-outstanding-events-on-restart: true # ao subir, refaz os que ficaram pela metade

  # E-mail por SMTP de qualquer provedor (Amazon SES, Brevo, Resend...). Sem host, o e-mail fica desligado.
  # Em produção: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD.

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

condomix:
  seguranca:
    jwt:
      segredo: ${JWT_SEGREDO:}   # obrigatório, mínimo 32 bytes. Em desenvolvimento vem do application-dev.yaml
      validade: 12h
      emissor: condomix
  armazenamento:
    diretorio: ${ARMAZENAMENTO_DIRETORIO:./dados/arquivos}   # onde os arquivos enviados ficam (desenvolvimento)
  admin:
    # Primeiro administrador da plataforma, criado ao subir se ainda não houver nenhum.
    email: ${CONDOMIX_ADMIN_EMAIL:}
    senha: ${CONDOMIX_ADMIN_SENHA:}
  convite:
    validade: 7d
    endereco-do-app: ${CONDOMIX_ENDERECO_CONVITE:http://localhost:5173/convite}
  suporte:
    validade: 1h
  cofre:
    chave: ${CONDOMIX_COFRE_CHAVE:}   # 32 bytes em Base64; cifra as chaves de API dos gateways
  gateway:
    simulado: false   # gateway de mentira, só para desenvolvimento e testes
    # Endereço público da API, para montar a URL de aviso (webhook) que o gateway chama.
    endereco-publico: ${CONDOMIX_ENDERECO_PUBLICO:http://localhost:8080}
    processador:
      ativo: true
      intervalo: 10s   # de quanto em quanto tempo os boletos pendentes são emitidos ou cancelados no gateway
  notificacoes:
    endereco-do-app: ${CONDOMIX_ENDERECO_DO_APP:http://localhost:5173}   # links dos e-mails e do push
    remetente: ${CONDOMIX_EMAIL_REMETENTE:Condomix <avisos@condomix.com.br>}
    contato-push: ${CONDOMIX_CONTATO_PUSH:mailto:suporte@condomix.com.br}  # exigido pelos serviços de push
    intervalo-da-entrega: 15s   # de quanto em quanto tempo os e-mails e pushes pendentes saem
  lembretes:
    horario: "0 0 8 * * *"   # todo dia às 8h: cobrança vencendo, reserva amanhã, fatura atrasada, fim do teste
