spring:
  application:
    name: condomix

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/condomix}
    username: ${DB_USER:condomix}
    password: ${DB_PASSWORD:condomix}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é criado só pelo Flyway, nunca pelo Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  docker:
    compose:
      lifecycle-management: start-only   # sobe o Postgres e deixa rodando ao parar a app

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
